[project]
name = "intent-agent"
version = "0.1.0"
description = "POC intent-detection agent that routes search queries to a search strategy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "openai>=1.60",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
intent-agent = "intent_agent.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
